name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write
  # Lets the action create labels that don't exist in the repo yet, instead of
  # requiring them to be pre-created through the GitHub UI/API.
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d  # v6
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
