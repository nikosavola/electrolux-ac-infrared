name: Feature Request
description: Suggest a new feature or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe what you'd like to see.
  - type: textarea
    id: description
    attributes:
      label: Feature description
      description: What feature would you like to see and why?
      placeholder: |
        I would like... because...
    validations:
      required: true
  - type: input
    id: ac-model
    attributes:
      label: Air conditioner model (if relevant)
      placeholder: "EXP26U339HW"
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched existing issues
          required: true
